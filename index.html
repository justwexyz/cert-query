<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计量证书查询</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #f0f4f9;
      padding: 20px;
    }
    .card-wrap {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,60,0.15);
    }
    .top-bar {
      background-color: #2680d8;
      color: white;
      padding: 14px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
    .btn-area {
      padding: 16px;
    }
    .action-btn {
      width: 100%;
      padding: 12px;
      background-color: #2680d8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .info-row {
      display: flex;
      border-bottom: 1px solid #eee;
    }
    .label-col {
      width: 32%;
      background-color: #d8ecfb;
      padding: 10px 8px;
      font-size: 15px;
    }
    .value-col {
      width: 68%;
      padding: 10px 8px;
      font-size: 15px;
    }
    .footer-note {
      padding: 16px;
      text-align: center;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="top-bar">计量证书查询</div>
    <div class="btn-area">
      <button class="action-btn" id="showBtn">显示证书内容</button>
    </div>
    <div id="certContent">
      <div class="info-row">
        <div class="label-col">证书编号</div>
        <div class="value-col">YDAL202611-0354</div>
      </div>
      <div class="info-row">
        <div class="label-col">单位名称</div>
        <div class="value-col">中建八局华中建设有限公司</div>
      </div>
      <div class="info-row">
        <div class="label-col">器具名称</div>
        <div class="value-col">电液式压力试验机</div>
      </div>
      <div class="info-row">
        <div class="label-col">型号/规格</div>
        <div class="value-col">DYE-3000</div>
      </div>
      <div class="info-row">
        <div class="label-col">出厂编号</div>
        <div class="value-col">20230112</div>
      </div>
      <div class="info-row">
        <div class="label-col">制造厂商</div>
        <div class="value-col">北京高科建仪有限公司</div>
      </div>
      <div class="info-row">
        <div class="label-col">校检日期</div>
        <div class="value-col">20261105</div>
      </div>
    </div>
    <div class="footer-note">
      校验单位：阜阳远大计量检测有限公司
    </div>
  </div>

  <script>
    const btn = document.getElementById("showBtn");
    btn.onclick = () => {
      alert("");
    };
  </script>
</body>
</html>
